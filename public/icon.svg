<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Outer Glow border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="8"/>
  
  <!-- Candlestick / Pulse Chart Icon -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Pulse Line -->
    <path d="M 40 300 L 120 300 L 170 180 L 220 380 L 290 120 L 350 280 L 400 240 L 472 240" 
          fill="none" stroke="url(#chartGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Active Peak Glow Dots -->
    <circle cx="290" cy="120" r="22" fill="#10b981"/>
    <circle cx="290" cy="120" r="10" fill="#ffffff"/>
    
    <circle cx="220" cy="380" r="18" fill="#ef4444"/>
    <circle cx="220" cy="380" r="8" fill="#ffffff"/>

    <!-- Upward Trend Arrow -->
    <path d="M 370 120 L 460 120 L 460 210 M 460 120 L 330 250" 
          fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
